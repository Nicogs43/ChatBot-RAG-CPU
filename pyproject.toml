[project]
name = "marinechat"
version = "0.1.0"
description = "RAG chatbot for the maritime domain, built on Small Language Models running on Intel CPUs through OpenVINO"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # RAG pipeline
    "langchain-core>=1.6",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.1",
    "faiss-cpu>=1.16",
    "pypdf>=7.0",
    "jinja2>=3.1",
    # Inference engine and model export
    "openvino>=2026.4",
    "openvino-tokenizers>=2026.4",
    "optimum-intel[openvino]>=2.0",
    "nncf>=3.4",
    "transformers>=5.0",
    "torch>=2.15",
    # UI
    "gradio>=6.31",
    # Evaluation and timing scripts
    "pandas>=3.1",
    "psutil>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["bin"]
extend-exclude = ["evaluation"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"bin/config.py" = ["E501"]  # the system prompts are single long lines on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bin"]
filterwarnings = [
    # Known and accepted for now: FAISS, the OpenVINO embeddings and the reranker come from langchain-community.
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]

# PyPI's Linux torch wheels bundle CUDA; this project is CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
