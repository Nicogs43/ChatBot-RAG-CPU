[project]
name = "marinechat"
version = "0.1.0"
description = "RAG chatbot for the maritime domain, built on Small Language Models running on Intel CPUs through OpenVINO"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
# Pinned to the versions the thesis experiments were run with.
dependencies = [
    # RAG pipeline
    "langchain==0.2.16",
    "langchain-community==0.2.16",
    "langchain-huggingface==0.0.3",
    "faiss-cpu==1.8.0.post1",
    "pypdf==4.3.1",
    "sentence-transformers==3.1.0",
    # Inference engine and model export
    "openvino==2024.3.0",
    "openvino-tokenizers==2024.3.0.0",
    "optimum==1.22.0",
    "optimum-intel[openvino]==1.19.0",
    "nncf==2.12.0",
    "transformers==4.44.2",
    "torch==2.4.1",
    # UI
    "gradio==4.44.0",
    # Evaluation and timing scripts
    "pandas==2.2.2",
    "datasets==3.0.0",
    "psutil==6.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.6.4",
]

# PyPI's Linux torch wheels bundle CUDA; this project is CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
